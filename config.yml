# Tudo que você quiser ajustar fica aqui. Preços em R$, ida e volta.

busca:
  meses_a_frente: 5          # quantos meses pra frente procurar
  pausa_entre_chamadas: 0.3  # segundos (evita bater no limite da API)
  max_alertas_por_rodada: 12
  cooldown_dias: 5           # não repete o mesmo alerta antes disso...
  reavisar_se_cair: 0.05     # ...a não ser que o preço caia mais 5%

# "Promo" = abaixo do teto do grupo OU X% abaixo da mediana histórica da rota
regra_promo:
  queda_vs_mediana: 0.30     # 30% abaixo do normal
  min_dias_historico: 5      # precisa de alguns dias de dados pra confiar na mediana

origens:
  # principal = SP. Alternativas só alertam se compensarem MESMO com o ônibus.
  - { codigo: SAO, nome: "São Paulo (GRU/CGH)", onibus: 0,   principal: true }
  - { codigo: VCP, nome: "Campinas (Viracopos)", onibus: 70,  principal: true }
  - { codigo: RIO, nome: "Rio (GIG/SDU)",        onibus: 260, principal: false }
  - { codigo: BHZ, nome: "BH (CNF)",             onibus: 300, principal: false }

# Origem alternativa só vale se o custo total (passagem + ônibus) ficar
# pelo menos isso abaixo do melhor preço saindo de SP pro mesmo destino.
economia_minima_alternativa: 250

